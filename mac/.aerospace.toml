# AeroSpace - Tiling Window Manager for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Required for persistent-workspaces
config-version = 2

# Keep workspaces alive even when empty (prevents workspace destruction)
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']

after-login-command = []
after-startup-command = [
  'exec-and-forget /Users/abdullahalharbi/.local/bin/theme reload'
]
# Gruvbox Border Colors (copy to after-startup-command):
# Bright Red:    0xfffb4934
# Dark Red:      0xffcc241d
# Bright Green:  0xffb8bb26
# Dark Green:    0xff98971a
# Bright Yellow: 0xfffabd2f
# Dark Yellow:   0xffd79921
# Bright Blue:   0xff83a598
# Dark Blue:     0xff458588
# Bright Purple: 0xffd3869b
# Dark Purple:   0xffb16286
# Bright Aqua:   0xff8ec07c
# Dark Aqua:     0xff689d6a
# Bright Orange: 0xfffe8019
# Dark Orange:   0xffd65d0e
start-at-login = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Enable normalization for proper tiling
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion layout padding
accordion-padding = 30

# Default layout - manual tiling (you control placement)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# =============================================================================
# GAPS
# =============================================================================
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 15
outer.right = 15
outer.top = 15
outer.bottom = 15

# =============================================================================
# MAIN MODE KEYBINDINGS (Omarchy-style: Super/Cmd)
# =============================================================================
[mode.main.binding]

# -----------------------------------------------------------------------------
# Workspace Switching (cmd + number)
# -----------------------------------------------------------------------------
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 0'

# -----------------------------------------------------------------------------
# Move Window to Workspace (cmd + shift + number)
# -----------------------------------------------------------------------------
cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-0 = 'move-node-to-workspace 0'

# -----------------------------------------------------------------------------
# Focus Navigation (cmd + arrows)
# -----------------------------------------------------------------------------
cmd-left = 'focus left'
cmd-right = 'focus right'
cmd-up = 'focus up'
cmd-down = 'focus down'

# -----------------------------------------------------------------------------
# Launch Apps / New Window
# -----------------------------------------------------------------------------
cmd-enter = 'exec-and-forget open -na WezTerm'
cmd-n = 'exec-and-forget /Users/abdullahalharbi/.local/bin/new-window'
cmd-b = 'exec-and-forget open -na "Google Chrome"'
cmd-o = 'exec-and-forget open -na Obsidian'

# -----------------------------------------------------------------------------
# Theme + Wallpaper (Omarchy-style)
# -----------------------------------------------------------------------------
cmd-ctrl-t = 'exec-and-forget /Users/abdullahalharbi/.local/bin/theme cycle'
cmd-ctrl-w = 'exec-and-forget /Users/abdullahalharbi/.local/bin/theme wallpaper next'
cmd-h = 'exec-and-forget /Users/abdullahalharbi/.local/bin/menu-toggle'

# -----------------------------------------------------------------------------
# Close Window (cmd + w, with workspace preservation - fixes macOS race condition)
# -----------------------------------------------------------------------------
cmd-w = '''exec-and-forget current_workspace="$(aerospace list-workspaces --focused)"; \
aerospace close; \
aerospace workspace "$current_workspace"'''

# -----------------------------------------------------------------------------
# Layout Controls
# -----------------------------------------------------------------------------
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
cmd-f = 'fullscreen'

# -----------------------------------------------------------------------------
# Resize
# -----------------------------------------------------------------------------
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# -----------------------------------------------------------------------------
# Move Tiled Window (cmd + shift + arrows, Omarchy-style)
# -----------------------------------------------------------------------------
cmd-shift-left = 'move left'
cmd-shift-right = 'move right'
cmd-shift-up = 'move up'
cmd-shift-down = 'move down'

# =============================================================================
# FORCE ALL WINDOWS TO TILE
# =============================================================================
[[on-window-detected]]
run = 'layout tiling'
