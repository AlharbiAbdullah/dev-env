# AeroSpace - Tiling Window Manager for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Required for persistent-workspaces
config-version = 2

# Keep workspaces alive even when empty (prevents workspace destruction)
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']

after-login-command = []
after-startup-command = [
  'exec-and-forget /Users/abdullahalharbi/.local/bin/theme reload'
]
# Gruvbox Border Colors (copy to after-startup-command):
# Bright Red:    0xfffb4934
# Dark Red:      0xffcc241d
# Bright Green:  0xffb8bb26
# Dark Green:    0xff98971a
# Bright Yellow: 0xfffabd2f
# Dark Yellow:   0xffd79921
# Bright Blue:   0xff83a598
# Dark Blue:     0xff458588
# Bright Purple: 0xffd3869b
# Dark Purple:   0xffb16286
# Bright Aqua:   0xff8ec07c
# Dark Aqua:     0xff689d6a
# Bright Orange: 0xfffe8019
# Dark Orange:   0xffd65d0e
start-at-login = true

# Reload this file automatically on save (0.21.0+). No more `aerospace reload-config`.
auto-reload-config = true

# Move the mouse to the center of the newly focused monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Enable normalization for proper tiling
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion layout padding
accordion-padding = 30

# Default layout - manual tiling (you control placement)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# =============================================================================
# GAPS
# =============================================================================
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 15
outer.right = 15
outer.top = 15
outer.bottom = 15

# =============================================================================
# MAIN MODE KEYBINDINGS (Omarchy-style: Super/Cmd)
# Unified with the Linux box 2026-08-27: Super or Ctrl only, Shift ok, no Alt.
# Full table: helm/05-projects/kitchen/omarchy-migration/keybindings-unify.md
# =============================================================================
[mode.main.binding]

# -----------------------------------------------------------------------------
# Workspace Switching (cmd + number)
# -----------------------------------------------------------------------------
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 0'
cmd-ctrl-tab = 'workspace-back-and-forth'

# -----------------------------------------------------------------------------
# Move Window to Workspace (cmd + shift + number), focus follows like Hyprland
# -----------------------------------------------------------------------------
cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
cmd-shift-0 = 'move-node-to-workspace --focus-follows-window 0'

# -----------------------------------------------------------------------------
# Focus Navigation (cmd + arrows)
# -----------------------------------------------------------------------------
cmd-left = 'focus left'
cmd-right = 'focus right'
cmd-up = 'focus up'
cmd-down = 'focus down'

# -----------------------------------------------------------------------------
# Launch Apps / New Window
# -----------------------------------------------------------------------------
cmd-enter = 'exec-and-forget /Users/abdullahalharbi/.local/bin/iterm2-window'
cmd-n = 'exec-and-forget /Users/abdullahalharbi/.local/bin/new-window'
cmd-b = 'exec-and-forget open -na "Google Chrome"'
cmd-o = 'exec-and-forget open -na Obsidian'

# -----------------------------------------------------------------------------
# Theme + Wallpaper (Omarchy-style)
# -----------------------------------------------------------------------------
cmd-ctrl-t = 'exec-and-forget /opt/homebrew/bin/hs -c "themeChooser()"'
cmd-ctrl-shift-t = 'exec-and-forget /Users/abdullahalharbi/.local/bin/theme cycle'
cmd-ctrl-w = 'exec-and-forget /opt/homebrew/bin/hs -c "wallpaperChooser()"'
cmd-ctrl-shift-w = 'exec-and-forget /Users/abdullahalharbi/.local/bin/theme wallpaper next'
# Focus mode (float + centre, same as Linux SUPER+H); menu bar hide on the bar key.
cmd-h = 'exec-and-forget /opt/homebrew/bin/hs -c "focusMode()"'
cmd-shift-ctrl-b = 'exec-and-forget /Users/abdullahalharbi/.local/bin/menu-toggle'

# -----------------------------------------------------------------------------
# Close Window (cmd + w)
# The old capture-close-restore shell workaround is gone: verified 2026-08-16 on
# 0.21.3 that closing the last window in a workspace no longer teleports focus.
# -----------------------------------------------------------------------------
cmd-w = 'close'

# -----------------------------------------------------------------------------
# Layout Controls
# -----------------------------------------------------------------------------
cmd-j = 'layout tiles horizontal vertical'
cmd-g = 'layout accordion horizontal vertical'
cmd-f = 'fullscreen'
# Toggle the focused window between floating and tiling (un-float stragglers)
cmd-shift-space = 'layout floating tiling'

# -----------------------------------------------------------------------------
# Resize
# -----------------------------------------------------------------------------
cmd-minus = 'resize width -100'
cmd-equal = 'resize width +100'
cmd-shift-minus = 'resize height -100'
cmd-shift-equal = 'resize height +100'
cmd-ctrl-minus = 'resize width -25'
cmd-ctrl-equal = 'resize width +25'

# -----------------------------------------------------------------------------
# Move Tiled Window (cmd + shift + arrows, Omarchy-style)
# -----------------------------------------------------------------------------
cmd-shift-left = 'move left'
cmd-shift-right = 'move right'
cmd-shift-up = 'move up'
cmd-shift-down = 'move down'

# =============================================================================
# FORCE ALL WINDOWS TO TILE
# =============================================================================
[[on-window-detected]]
if = 'true'
run = 'layout tiling'
