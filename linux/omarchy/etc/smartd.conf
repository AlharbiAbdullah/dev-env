# smartd: watch every SMART-capable disk (the one NVMe holding the vault git,
# ChromaDB and the restic cache). No mail: warnings go to the desktop through
# /usr/local/bin/smartd-desktop-alert. Short self-test Saturdays 03:00, ahead of
# the 04:00 restic run. Temperature: log 4C jumps, warn at 60C, critical at 70C.
DEVICESCAN -a -n standby,q -W 4,60,70 -s (S/../../6/03) -m <nomailer> -M exec /usr/local/bin/smartd-desktop-alert
