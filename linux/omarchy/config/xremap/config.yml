# xremap: the few Super chords that must reach GUI apps as Ctrl on Linux.
#
# WHY: clipboard/undo are Ctrl+C/V/X/A/Z on BOTH machines since 2026-09-08 (the
# Mac remaps Ctrl to Cmd in Hammerspoon), so nothing to do here for those. What
# remains is the Mac reflexes that stay on Super: Super+T new tab, Super+R /
# Super+Shift+R reload, Super+L address bar, Super+Q quit.
#
# WHY NOT keyd: keyd rewrites at the hardware level with zero window awareness,
# so a blanket Super->Ctrl remap also rewrote keys inside the terminal and broke
# Ctrl+C as the shell interrupt. It was purged for that. xremap reads the focused
# window class over Hyprland's IPC, so terminals can be excluded by name.
#
# NEEDS: user in the `input` group (udev 99-xremap.rules). Omarchy 4.0.2's
# migration on 2026-08-31 removed it and xremap crash-looped for a week; the
# group was re-added 2026-09-08.
#
# ESCAPE HATCH: if this ever wedges the keyboard, `systemctl --user stop xremap`
# from an SSH session (Mac -> linux over Tailscale) releases the device grab.

keymap:
  # Cursor gets Super+T raw: its keybindings.json binds meta+t to a new untitled
  # file, and Ctrl+T there is the terminal toggle. First matching keymap wins.
  - name: Cursor
    application:
      only:
        - cursor
    exact_match: true
    remap:
      Super-Shift-r: C-Shift-r
      Super-r: C-r
      Super-l: C-l
      Super-q: C-q

  - name: Mac-style Super shortcuts (GUI apps only, never terminals)
    # xremap intercepts at the evdev layer, BELOW the compositor. Excluding the
    # terminal classes here means Super+T is never rewritten there (Ghostty binds
    # it to new_tab itself). Keys not listed under `remap` pass through, so
    # Hyprland still gets Super+1..0, Super+W, Super+Space, etc.
    application:
      not:
        - com.mitchellh.ghostty
        - org.wezfurlong.wezterm
        - kitty
        - Alacritty
        - foot
        - xterm
        - cursor
    # exact_match keeps Super+Shift+R distinct from Super+R.
    exact_match: true
    remap:
      Super-t: C-t
      Super-Shift-r: C-Shift-r
      Super-r: C-r
      # Unified map 2026-08-27: Super+L = address bar (lock is Super+Ctrl+L),
      # Super+Q = quit app (Mac Cmd+Q). Hyprland no longer binds Super+L.
      Super-l: C-l
      Super-q: C-q
