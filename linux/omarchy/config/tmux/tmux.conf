# One tmux config for Mac and Linux (KEYBINDINGS.md, decided 2026-09-08).
# Linux: ~/.config/tmux/tmux.conf (wl-copy). Mac: ~/.tmux.conf (pbcopy).
# Only the clipboard command differs. Base settings are Omarchy's, kept on
# the Mac too so both machines feel identical.

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Keys: stock Ctrl+B prefix, | and - splits (decision 8.4, revised 2026-09-08)
set -g prefix C-b
bind C-b send-prefix
bind | split-window -h
bind - split-window -v

# Mouse on; a drag copies to the system clipboard
set -g mouse on
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Shift+Enter passthrough (Claude Code newline)
bind -n S-Enter send-keys Escape "[13;2u"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Theme colors: rendered by `theme` on every switch. Guarded for a fresh checkout.
if-shell "test -f ~/.config/tmux/theme.conf" "source-file ~/.config/tmux/theme.conf"

# Plugins
# sesh: session switcher over zoxide + fzf (2026-09-09). prefix T opens the picker.
bind T run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70%)\""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
