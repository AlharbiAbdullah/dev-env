<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- No programming ligatures anywhere (2026-09-21). Turns off liga, calt and dlig
     for every monospace font, for any app that shapes text through fontconfig
     (GTK/Pango, Qt/Quickshell). Ghostty and VS Code/Cursor also disable them in
     their own configs, since they don't read this. -->
<fontconfig>
  <match target="font">
    <test name="spacing" compare="eq"><const>mono</const></test>
    <edit name="fontfeatures" mode="append">
      <string>liga off</string>
      <string>calt off</string>
      <string>dlig off</string>
    </edit>
  </match>
</fontconfig>
