# Minimal two-line prompt, colors driven by the active theme palette.
# The `theme` script updates the `palette = ...` line below on theme switch.

palette = "calma-dark"

format = "$hostname$directory$git_branch$git_status$cmd_duration$character "

add_newline = true

# git can exceed the 500ms default in large repos (e.g. ~/helm), which
# spams [WARN] timeout lines into the prompt.
command_timeout = 2000

[character]
success_symbol = "[\u279c](bold fg:accent)"
error_symbol = "[\u2717](bold fg:red)"

# Remote-session OS icon: one quiet glyph, shown ONLY over SSH (ssh_only keys
# off $SSH_CONNECTION/$SSH_TTY). This config runs on Linux, so it shows the Tux
# glyph; the Mac's own starship.toml uses the Apple glyph (\uf179). Local = none.
[hostname]
ssh_only = true
format = "[\uf17c](fg:accent) "

[directory]
style = "bold fg:accent"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "fg:yellow"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2000
style = "fg:blue"
format = "[took $duration]($style) "

