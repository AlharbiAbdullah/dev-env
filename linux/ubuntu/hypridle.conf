# hypridle config — lock + DPMS for the Ubuntu Hyprland setup.
# Deployed to ~/.config/hypr/hypridle.conf

general {
    # Avoid spawning a second hyprlock instance if one is already running.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before the system suspends.
    before_sleep_cmd = loginctl lock-session
    # Wake the display when the session resumes.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock the screen after 10 minutes of inactivity.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn the display off after 15 minutes; turn it back on when activity resumes.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
