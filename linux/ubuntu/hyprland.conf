# Hyprland config — 1:1 mirror of the Mac AeroSpace setup (cmd -> SUPER). Deployed to ~/.config/hypr/hyprland.conf

# ============================================================================
# MONITORS
# ============================================================================
monitor = ,preferred,auto,1
# HiDPI example (uncomment + adjust scale for a high-density display):
# monitor = ,preferred,auto,2

# ============================================================================
# ENVIRONMENT
# ============================================================================
env = XCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ============================================================================
# INPUT (us + arabic, Alt+Shift toggles layout)
# ============================================================================
input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
}

# ============================================================================
# GENERAL (gaps match the live Mac AeroSpace setup: inner 10, outer 15)
# ============================================================================
general {
    gaps_in = 10
    gaps_out = 15
    border_size = 3
    # Placeholder — the theme script overrides this at runtime via
    # `hyprctl keyword general:col.active_border`. Everforest is the default.
    col.active_border = 0xffdbbc7f
    col.inactive_border = 0x00000000
    layout = dwindle
}

# ============================================================================
# DECORATION
# ============================================================================
decoration {
    rounding = 0
}

# ============================================================================
# ANIMATIONS (workspace switching must be instant; keep the rest subtle)
# ============================================================================
animations {
    enabled = true
    animation = workspaces, 0
    animation = specialWorkspace, 0
    animation = windows, 1, 2, default
    animation = fade, 1, 2, default
    animation = border, 1, 2, default
}

# ============================================================================
# LAYOUT
# ============================================================================
dwindle {
    preserve_split = true
}

# ============================================================================
# STARTUP
# ============================================================================
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
# Fallback if the systemd user unit is unavailable:
# exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
# Sets border color + wallpaper (starts swaybg itself) + starship palette.
exec-once = ~/.local/bin/theme reload

# ============================================================================
# WORKSPACE SWITCHING (SUPER + number; cmd-0 -> workspace 10)
# ============================================================================
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# ============================================================================
# MOVE WINDOW TO WORKSPACE (SUPER + SHIFT + number; cmd-shift-0 -> workspace 10)
# ============================================================================
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# ============================================================================
# FOCUS NAVIGATION (SUPER + arrows)
# ============================================================================
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# ============================================================================
# MOVE WINDOW (SUPER + SHIFT + arrows)
# ============================================================================
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# ============================================================================
# APPS / NEW WINDOW
# ============================================================================
bind = SUPER, return, exec, wezterm
bind = SUPER, N, exec, ~/.local/bin/new-window
# Edit to your installed browser (e.g. firefox) if Chrome is not installed:
bind = SUPER, B, exec, google-chrome
bind = SUPER, O, exec, obsidian

# ============================================================================
# THEME + WALLPAPER
# ============================================================================
bind = SUPER CTRL, T, exec, ~/.local/bin/theme cycle
bind = SUPER CTRL, W, exec, ~/.local/bin/theme wallpaper next

# ============================================================================
# WINDOW MANAGEMENT
# ============================================================================
bind = SUPER, W, killactive
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, space, togglefloating

# ============================================================================
# LAYOUT CONTROLS
# ============================================================================
bind = ALT, slash, togglesplit
bind = ALT, comma, togglegroup

# ============================================================================
# RESIZE (binde = repeat while held; ALT minus/equal width, +SHIFT height)
# ============================================================================
binde = ALT, minus, resizeactive, -50 0
binde = ALT, equal, resizeactive, 50 0
binde = ALT SHIFT, minus, resizeactive, 0 -50
binde = ALT SHIFT, equal, resizeactive, 0 50

# ============================================================================
# LAUNCHER
# ============================================================================
bind = SUPER, D, exec, fuzzel

# ============================================================================
# SCREENSHOTS
# Hyprland runs exec args through /bin/sh, so the pipe and $(...) below are
# evaluated by the shell at press time.
#   CTRL + 3 -> full screen, copy PNG to the clipboard (paste with Ctrl+V)
#   CTRL + 4 -> select a box/region, copy PNG to the clipboard
#   Print    -> save the full screen to ~/Pictures with a timestamped name
# ============================================================================
bind = CTRL, 3, exec, grim - | wl-copy
bind = CTRL, 4, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# ============================================================================
# MEDIA KEYS
# Hyprland binds nothing by default, so XF86 keys must be mapped explicitly.
# bindel = repeats while held + works on the lock screen.
# 5%+ is capped at 100% by the -l 1.0 limit flag.
# ============================================================================
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Desktop monitor (KTC H27T27) has no kernel backlight; brightness goes over
# DDC/CI instead. plain bind (no repeat): each DDC write takes ~200ms, key
# repeat would queue a backlog. --noverify skips the read-back for speed.
bind = , XF86MonBrightnessUp, exec, ddcutil --noverify setvcp 10 + 10
bind = , XF86MonBrightnessDown, exec, ddcutil --noverify setvcp 10 - 10

# ============================================================================
# SESSION
# ============================================================================
bind = SUPER SHIFT, R, exec, hyprctl reload
bind = SUPER, L, exec, hyprlock
