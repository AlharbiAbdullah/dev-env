# hyprlock config — minimal everforest lock screen.
# Deployed to ~/.config/hypr/hyprlock.conf

background {
    monitor =
    color = rgb(2d353b)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(dbbc7f)
    inner_color = rgb(343f44)
    font_color = rgb(d3c6aa)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(d3c6aa)
    font_size = 90
    font_family = sans-serif
    position = 0, 120
    halign = center
    valign = center
}
