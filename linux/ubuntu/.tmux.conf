# Prefix Ctrl+b (default)
set -g prefix C-b
bind C-b send-prefix

# Indexing from 1
set -g base-index 1
setw -g pane-base-index 1

# Splits
bind | split-window -h
bind - split-window -v

# Mouse
set -g mouse on

# Wayland clipboard (Omarchy is Hyprland/Wayland)
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Shift+Enter passthrough
bind -n S-Enter send-keys Escape "[13;2u"

# Theme colors — generated by ~/.local/bin/theme, follows the active theme.
# Guarded so a fresh checkout (before first `theme` run) doesn't error.
if-shell "test -f ~/.config/tmux/theme.conf" "source-file ~/.config/tmux/theme.conf"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
